[project]
name = "epoch-bench"
version = "0.1.0"
description = "Benchmark tasks staged for auditing: Epoch AI's Chess Puzzles (reconstructed) and BFCL (inspect_evals, agentic gates lifted)"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.152"]

[project.optional-dependencies]
simpleqa = ["datasets>=2.0"]
bfcl = [
  "inspect-evals[bfcl] @ git+https://github.com/UKGovernmentBEIS/inspect_evals.git@4e0615e5fd5eadd55a3508a8c20d1b97de992f5b",
]

[project.entry-points.inspect_ai]
bench = "bench._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
include = ["bench/task/chess_puzzles/puzzles.csv", "bench/task/simpleqa_verified/grader_template.txt"]

[tool.hatch.metadata]
allow-direct-references = true
